<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">tame.gg</title>
  <desc id="d">tame.gg wordmark in gold on a light background</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="1" stop-color="#f3ede2"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8B84A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E8B84A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B84A"/>
      <stop offset="0.55" stop-color="#C99530"/>
      <stop offset="1" stop-color="#8a6420"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff8e6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff8e6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff8e6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C99530" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8B84A"/>
      <stop offset="1" stop-color="#C99530" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="wm">
      <text x="600" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="132" font-weight="700" letter-spacing="2">tame.gg</text>
    </clipPath>
  </defs>
  <style>
    .halo { animation: breathe 6s ease-in-out infinite; transform-origin: 600px 140px; }
    .glow { animation: pulse 4s ease-in-out infinite; }
    .sheen { animation: sweep 5s ease-in-out infinite; }
    .mote { animation: drift 14s ease-in-out infinite; }
    .m2 { animation-duration: 18s; animation-delay: -4s; }
    .m3 { animation-duration: 22s; animation-delay: -9s; }
    .m4 { animation-duration: 16s; animation-delay: -12s; }
    @keyframes breathe { 0%,100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .75; } }
    @keyframes sweep { 0% { transform: translateX(-420px); } 60%,100% { transform: translateX(1200px); } }
    @keyframes drift { 0%,100% { transform: translate(0,0); opacity: .25; } 50% { transform: translate(18px,-22px); opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <ellipse class="halo" cx="600" cy="140" rx="420" ry="130" fill="url(#halo)"/>
  <g fill="#C99530">
    <circle class="mote" cx="170" cy="210" r="2"/>
    <circle class="mote m2" cx="290" cy="80" r="1.5"/>
    <circle class="mote m3" cx="960" cy="220" r="2"/>
    <circle class="mote m4" cx="1050" cy="90" r="1.5"/>
    <circle class="mote m2" cx="820" cy="60" r="1.2"/>
    <circle class="mote m3" cx="380" cy="240" r="1.2"/>
  </g>
  <text class="glow" x="600" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="132" font-weight="700" letter-spacing="2" fill="#F3D58A" filter="url(#glow)">tame.gg</text>
  <text x="600" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="132" font-weight="700" letter-spacing="2" fill="url(#gold)">tame.gg</text>
  <g clip-path="url(#wm)">
    <rect class="sheen" x="0" y="40" width="220" height="160" fill="url(#sheen)" transform="skewX(-20)"/>
  </g>
  <rect x="420" y="200" width="360" height="1.5" fill="url(#rule)"/>
  <text x="600" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="6" fill="#5a4318" fill-opacity="0.85">STATS · SERVERS · APPS</text>
</svg>
